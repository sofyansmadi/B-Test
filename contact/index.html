<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>راسلنا — بوضوح</title>
<meta name="description" content="هل لديك سؤال أو ملاحظة؟ راسلنا وسنرد عليك في أقرب وقت.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241D2E; --ink-soft:#372C46; --plum:#4A3B5C;
    --fog:#F3EEEA; --fog-dim:#E6DFDA;
    --clarity:#C9A15F; --clarity-soft:#E4C98A; --rose:#8B6F7E; --alert:#B5555B;
    --text-on-dark:#EDE7E3; --text-muted-dark:#B7ACC4;
    --text-on-light:#2A2130; --text-muted-light:#6B6072;
    --radius:14px; --max:760px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--fog); color:var(--text-on-light); line-height:1.9; -webkit-font-smoothing:antialiased; }
  h1,h2,.kufi{ font-family:'Noto Kufi Arabic', sans-serif; }
  a{ color:inherit; }
  .wrap{ max-width:var(--max); margin:0 auto; padding:0 24px; }

  nav{ position:sticky; top:0; z-index:50; background:rgba(36,29,46,.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(255,255,255,.06); }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1080px; }
  .brand{ font-family:'Noto Kufi Arabic',sans-serif; font-weight:900; font-size:22px; color:var(--fog); text-decoration:none; }
  .brand span{ color:var(--clarity); }
  .nav-links{ display:flex; align-items:center; gap:28px; }
  .nav-links a{ color:var(--text-muted-dark); font-size:14px; font-weight:500; text-decoration:none; transition:color .2s; }
  .nav-links a:hover{ color:var(--fog); }
  a.nav-cta{ background:var(--clarity); color:var(--ink); font-weight:700; font-size:14px; padding:9px 20px; border-radius:100px; transition:transform .15s ease, background .2s ease; }
  a.nav-cta:hover{ background:var(--clarity-soft); transform:translateY(-1px); }
  @media (max-width:780px){ .nav-links{ display:none; } }

  .page-head{ background:radial-gradient(120% 90% at 75% 0%, var(--ink-soft) 0%, var(--ink) 55%, #1A1522 100%); padding:64px 0 48px; text-align:center; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--clarity-soft); font-weight:600; margin-bottom:14px; justify-content:center; }
  .eyebrow::before{ content:""; width:20px; height:1px; background:var(--clarity-soft); display:inline-block; }
  .page-head h1{ color:var(--fog); font-size:clamp(28px,4.4vw,42px); font-weight:900; max-width:20ch; margin:0 auto; line-height:1.4; }
  .page-head p{ color:var(--text-muted-dark); font-size:15.5px; max-width:48ch; margin:14px auto 0; }

  main{ padding:56px 0 90px; }

  .form-card{ background:#fff; border:1px solid var(--fog-dim); border-radius:20px; padding:38px 34px; box-shadow:0 24px 50px -30px rgba(36,29,46,.25); }
  @media (max-width:600px){ .form-card{ padding:28px 20px; } }

  .field{ margin-bottom:22px; }
  .field label{ display:block; font-family:'Noto Kufi Arabic',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink); margin-bottom:10px; }
  .field input, .field textarea{
    width:100%; border:1.5px solid var(--fog-dim); border-radius:12px; padding:14px 16px;
    font-family:'IBM Plex Sans Arabic', sans-serif; font-size:15px; color:var(--text-on-light);
    background:var(--fog); transition:.15s; resize:vertical;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--clarity); background:#fff; }
  .field textarea{ min-height:160px; line-height:1.8; }
  .field .hint{ font-size:12.5px; color:var(--text-muted-light); margin-top:6px; }

  .btn-primary{
    background:var(--ink); color:var(--fog); font-weight:700; font-size:15px; padding:15px 32px;
    border-radius:100px; border:none; cursor:pointer; font-family:inherit; transition:.2s; width:100%;
  }
  .btn-primary:hover{ background:var(--ink-soft); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }

  .note{ font-size:13px; color:var(--text-muted-light); text-align:center; margin-top:18px; }

  .alt-contact{ margin-top:36px; text-align:center; }
  .alt-contact p{ font-size:13.5px; color:var(--text-muted-light); }
  .alt-contact a{ color:var(--clarity); font-weight:600; text-decoration:none; }

  footer{ background:var(--ink); color:var(--text-muted-dark); padding:44px 0 28px; text-align:center; font-size:12.5px; }
  footer .brand{ display:block; margin-bottom:10px; font-size:18px; }
  footer a{ text-decoration:none; }
</style>
</head>
<body>

<site-nav></site-nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">تواصل معنا</div>
    <h1>راسلنا</h1>
    <p>هل لديك سؤال أو ملاحظة أو اقتراح؟ املأ النموذج وسنرد عليك في أقرب وقت ممكن.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="form-card">
      <form id="contactForm">
        <div class="field">
          <label for="fromEmail">بريدك الإلكتروني</label>
          <input type="email" id="fromEmail" name="fromEmail" placeholder="example@email.com" required>
        </div>
        <div class="field">
          <label for="messageBody">رسالتك</label>
          <textarea id="messageBody" name="messageBody" placeholder="اكتب رسالتك هنا..." required></textarea>
        </div>
        <button type="submit" class="btn-primary" id="sendBtn">إرسال</button>
        <p class="note">عند الضغط على إرسال، سيفتح تطبيق البريد الإلكتروني لديك مع الرسالة جاهزة — يجب فقط تأكيد الإرسال من هناك.</p>
      </form>
    </div>

    <div class="alt-contact">
      <p>أو راسلنا مباشرة على: <a href="mailto:hello@bewoodoh.com">hello@bewoodoh.com</a></p>
    </div>
  </div>
</main>

<site-footer></site-footer>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('fromEmail').value.trim();
  const message = document.getElementById('messageBody').value.trim();
  if (!email || !message) return;

  const subject = encodeURIComponent('رسالة جديدة من موقع بوضوح');
  const body = encodeURIComponent('من: ' + email + '\n\n' + message);
  window.location.href = 'mailto:hello@bewoodoh.com?subject=' + subject + '&body=' + body;
});
</script>

<script src="/components.js"></script>
</body>
</html>
